
{% extends "base.html" %}

{% block title %}Login - Typing Trainer{% endblock %}

{% block content %}
 <!-- LOADING SIGN -->
     <!-- LOADING SIGN -->
   <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-container">
            <div class="cube-scene">
                <div class="rubiks-cube" id="rubiksCube"></div>
            </div>
            <div class="loader-text">LOADING...</div>
        </div>
    </div>

 <div class="page-content" id="pageContent">
<div class="container">
    <div class="auth-container">
        <h1>Login</h1>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
                <span class="error-message" id="usernameError"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
                <span class="error-message" id="passwordError"></span>
            </div>

            <div id="formError" class="alert alert-error" style="display:none;"></div>
            <div id="formSuccess" class="alert alert-success" style="display:none;"></div>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
            <a href="/login/google" class="google-btn">
    Continue with Google
</a>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="/auth/register">Register here</a></p>
        </div>
    </div>
</div>
</div>

<script src="{{ url_for('static', filename='js/loader.js') }}"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    try {
        const response = await fetch('/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
            document.getElementById('formSuccess').textContent = data.message;
            document.getElementById('formSuccess').style.display = 'block';

            setTimeout(() => {
                window.location.href = data.redirect || '/dashboard';
            }, 1000);
        } else {
            document.getElementById('formError').textContent = data.error;
            document.getElementById('formError').style.display = 'block';
        }
    } catch (error) {
        document.getElementById('formError').textContent = 'An error occurred. Please try again.';
        document.getElementById('formError').style.display = 'block';
    }
});
</script>
{% endblock %}
